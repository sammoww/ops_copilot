version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opscopilot-backend
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-test-placeholder-for-offline-ci-eval-only}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opscopilot-frontend
    ports:
      - "8501:8501"
    environment:
      - OPSCOPILOT_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    command: streamlit run ui/app.py --server.port=8501 --server.address=0.0.0.0
    restart: unless-stopped
